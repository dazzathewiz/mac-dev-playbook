---
# Provisions the launch wrapper for the GitHub MCP server used by Claude
# Desktop, and registers it in Claude Desktop's config. The binary itself
# comes from homebrew_installed_packages.
#
# What this DOESN'T do: provision the PAT. That's a secret and creating it
# is interactive (`security add-generic-password`), so it stays a one-time
# manual step. This warns loudly if it's missing rather than leaving a
# wrapper that fails silently at launch.
#
# Claude Desktop must be closed while this runs — it also writes to
# claude_desktop_config.json, and a race between the two will clobber one
# side's changes.

- name: Ensure local bin directory exists
  file:
    path: "{{ ansible_facts.user_dir }}/.local/bin"
    state: directory
    mode: "0755"

- name: Install the GitHub MCP wrapper (reads the PAT from Keychain at launch)
  copy:
    dest: "{{ claude_mcp_wrapper }}"
    mode: "0755"
    content: |
      #!/bin/bash
      # Managed by mac-dev-playbook — do not edit by hand.
      set -euo pipefail
      TOKEN="$(security find-generic-password -a "$USER" -s {{ claude_mcp_keychain_service }} -w 2>/dev/null)" || {
        echo "github-mcp-claude: no Keychain item '{{ claude_mcp_keychain_service }}'." >&2
        echo "Create it with: security add-generic-password -a \"$USER\" -s {{ claude_mcp_keychain_service }} -w" >&2
        exit 1
      }
      export GITHUB_PERSONAL_ACCESS_TOKEN="$TOKEN"
      exec "{{ claude_mcp_binary }}" stdio --toolsets {{ claude_mcp_toolsets }}

- name: Check whether the PAT is present in Keychain
  command: security find-generic-password -a "{{ ansible_facts.user_id }}" -s "{{ claude_mcp_keychain_service }}"
  register: claude_mcp_keychain
  changed_when: false
  failed_when: false

- name: Warn if the PAT has not been provisioned
  debug:
    msg: >-
      GitHub MCP token missing from Keychain. Run once, by hand:
      security add-generic-password -a "$USER" -s {{ claude_mcp_keychain_service }} -w
  when: claude_mcp_keychain.rc != 0

# --- Claude Desktop config: merge, never overwrite -------------------------
# The file can contain other MCP servers and is also written by the app, so
# this reads-modifies-writes rather than templating the whole thing.

- name: Read existing Claude Desktop config
  slurp:
    src: "{{ claude_desktop_config }}"
  register: claude_cfg_raw
  failed_when: false

- name: Parse existing config (empty if absent)
  set_fact:
    claude_cfg: >-
      {{ (claude_cfg_raw.content | b64decode | from_json)
         if (claude_cfg_raw.content is defined) else {} }}

- name: Register the github MCP server, preserving any others
  copy:
    dest: "{{ claude_desktop_config }}"
    mode: "0600"
    content: |
      {{ claude_cfg | combine({
           'mcpServers': (claude_cfg.mcpServers | default({}))
             | combine({'github': {'command': claude_mcp_wrapper}})
         }, recursive=True) | to_nice_json }}
