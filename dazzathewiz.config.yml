---
configure_dotfiles: true
configure_terminal: false
configure_osx: true

# Set to 'true' to configure the Dock via dockutil.
configure_dock: true
dockitems_remove:
  - Launchpad
  - Mail
  - Maps
  - Photos
  - FaceTime
  - Calendar
  - Contacts
  - Reminders
  - Notes
  - TV
  - Music
  - Games
  - 'iPhone Mirroring'
dockitems_persist:
  - name: "Mission Control"
    path: "/System/Applications/Mission Control.app/"
    pos: 1
  - name: "Safari"
    path: "/System/Volumes/Preboot/Cryptexes/App/System/Applications/Safari.app/"
    pos: 2
  - name: "Messages"
    path: "/System/Applications/Messages.app/"
    pos: 3
  - name: "Google Chrome"
    path: "/Applications/Google Chrome.app/"
    pos: 4
  - name: "System Settings"
    path: "/System/Applications/System Settings.app/"
    pos: 5
  - name: "1Password"
    path: "/Applications/1Password.app/"
    pos: 6
  - name: "App Store"
    path: "/System/Applications/App Store.app/"
    pos: 7
  - name: "Terminal"
    path: "/System/Applications/Utilities/Terminal.app/"
    pos: 8

configure_sudoers: false
sudoers_custom_config: ""
# Example:
# sudoers_custom_config: |
#   # Allow users in admin group to use sudo with no password.
#   %admin ALL=(ALL) NOPASSWD: ALL

dotfiles_repo: https://github.com/dazzathewiz/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/code/dotfiles
dotfiles_repo_version: master  # Replace with your default branch
dotfiles_files:
  - .zshrc
  - .gitconfig
  - .profile
  - .config/starship.toml
  - .osx

homebrew_installed_packages:
  - age
  - ansible
  - balena-cli
  - flux
  - gh
  - git
  - helm
  - kubernetes-cli
  - mas
  - node                       # provides npm; mcp-remote bridges the Unraid MCP
  - sops
  - sshpass
  - starship
  - telnet
  - unar
  - github-mcp-server          # homebrew-core; GitHub MCP server for Claude
  - uv                         # installs proxmox-mcp-server (not in homebrew)

homebrew_taps:
  - datreeio/datree
  - fluxcd/tap
  - hudochenkov/sshpass

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - 1password
  - 1password-cli
  - adobe-acrobat-reader
  - balenaetcher
  - citrix-workspace
  - discord
  - dropbox
  - google-chrome
  - home-assistant
  - lens
  - logitech-g-hub
  - macfuse
  - microsoft-office
  - microsoft-teams
  - mos
  - mqtt-explorer
  - plex
  - scroll-reverser
  - slack
  - spotify
  - tailscale-app              # renamed from `tailscale`; reaches the homelab off-LAN
  - visual-studio-code
  - vlc
  - webex-meetings
  - zoom

# See `geerlingguy.mas` role documentation for usage instructions.
mas_installed_apps: []


mas_email: ""
mas_password: ""

osx_script: "~/.osx --no-restart"

# Install packages from other package managers.
# Note: You are responsible for making sure the required package managers are
# installed, eg. through homebrew.
composer_packages: []
# - name: drush
#   state: present # present/absent, default: present
#   version: "^8.1" # default: N/A
gem_packages: []
# - name: bundler
#   state: present # present/absent/latest, default: present
#   version: "~> 1.15.1" # default: N/A
npm_packages:
  # stdio<->HTTP bridge for the Unraid MCP server. Installed globally and
  # called by absolute path rather than via npx: resolving the package at
  # every launch overran Claude Desktop's startup window and surfaced as
  # "Server disconnected". Unpinned, consistent with the other MCP tooling.
  - name: mcp-remote
pip_packages: []

# - name: mkdocs
#   state: present # present/absent/latest, default: present
#   version: "0.16.3" # default: N/A

# Set to 'true' to configure Sublime Text.
configure_sublime: false
sublime_base_path: "~/Library/Application Support/Sublime Text"
sublime_config_path: "Packages/User"
sublime_package_control:
  - "DocBlockr"
  - "Dockerfile Syntax Highlighting"
  - "FileDiffs"
  - "GitHub Flavored Markdown Preview"
  - "Jinja2"
  - "Package Control"
  - "Pretty JSON"
  - "SublimeLinter"
  - "SublimeLinter-contrib-yamllint"
  - "Theme - Cobalt2"
  - "TrailingSpaces"
  - "WordingStatus"

# ---------------------------------------------------------------------------
# MCP servers for Claude Desktop
#
# Shared pattern: a wrapper script reads the secret from macOS Keychain and
# execs the server, so no credential is ever written into
# claude_desktop_config.json. The Keychain entries are created by hand, once.
#
# Two rules learned the hard way and encoded throughout:
#   1. Never resolve a package at MCP launch time (no uvx, no npx) — Claude
#      Desktop's startup window is short and an overrun reads as a crash.
#   2. Always use absolute paths — GUI apps don't inherit shell PATH.
# ---------------------------------------------------------------------------

# homebrew_prefix comes from the geerlingguy.mac.homebrew role's defaults.
claude_desktop_config: "{{ ansible_facts.user_dir }}/Library/Application Support/Claude/claude_desktop_config.json"

# --- GitHub (local, stdio) ---
claude_mcp_binary: "{{ homebrew_prefix }}/bin/github-mcp-server"
claude_mcp_wrapper: "{{ ansible_facts.user_dir }}/.local/bin/github-mcp-claude"
claude_mcp_keychain_service: claude-github-mcp
claude_mcp_toolsets: context,repos,issues,pull_requests

# --- Proxmox (local, stdio) ---
# Installed by uv rather than Homebrew (no formula exists), unpinned — see
# tasks/proxmox-mcp.yml.
#
# proxmox_mcp_user MUST be the read-only PVEAuditor identity, never root@pam
# (which is this server's own default). It has no read-only mode and exposes
# arbitrary API calls, so the token is the only boundary.
#
# proxmox_mcp_host is the node FQDN, not the short name — the nodes carry
# Let's Encrypt certs issued for the FQDN, which is what lets verify_ssl
# stay on with no CA bundle. Note this pins the MCP server to one node.
proxmox_mcp_binary: "{{ ansible_facts.user_dir }}/.local/bin/proxmox-mcp-server"
proxmox_mcp_wrapper: "{{ ansible_facts.user_dir }}/.local/bin/proxmox-mcp-claude"
proxmox_mcp_keychain_service: claude-proxmox-mcp
proxmox_mcp_host: prox1.dazzathewiz.com
proxmox_mcp_port: "8006"
proxmox_mcp_user: claude-ro@pve
proxmox_mcp_token_name: mcp
proxmox_mcp_verify_ssl: "1"
# Collapses 200+ tool schemas to 3 via semantic routing. No security cost —
# proxmox_api_raw is in the full toolkit either way — but a large saving in
# context on every request. Requires the [router] extra.
proxmox_mcp_tool_routing: "true"

# --- Unraid (remote HTTP on unNAS, bridged by mcp-remote) ---
# The only server that doesn't run on this Mac. Read-only is enforced on
# unNAS (READ_ONLY=true in the plugin config) plus the agent being bound to
# its tailnet address — nothing here enforces it.
#
# unraid_mcp_url uses the tailnet address deliberately, not 10.10.2.10: the
# subnet route SNATs, which would attribute every request to a prox node in
# unNAS's logs. A MagicDNS name would be better still.
unraid_mcp_bridge: "{{ homebrew_prefix }}/bin/mcp-remote"
unraid_mcp_wrapper: "{{ ansible_facts.user_dir }}/.local/bin/unraid-mcp-claude"
unraid_mcp_keychain_service: claude-unraid-mcp
unraid_mcp_url: "http://unnas.dazzathewiz.com:8043/mcp"

# Glob pattern to ansible task files to run after all other tasks are finished.
post_provision_tasks:
  - tasks/claude-mcp.yml
  - tasks/proxmox-mcp.yml
  - tasks/unraid-mcp.yml
